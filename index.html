<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园留言板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>校园留言板</h1>
            <p>分享想法，交流心得，共建美好校园</p>
        </header>
        
        <section class="message-form">
            <h2>发布新留言</h2>
            <form id="postForm">
                <div class="form-group">
                    <label for="author">你的姓名</label>
                    <input type="text" id="author" placeholder="请输入你的姓名" required>
                </div>
                <div class="form-group">
                    <label for="title">留言标题</label>
                    <input type="text" id="title" placeholder="请输入留言标题" required>
                </div>
                <div class="form-group">
                    <label for="content">留言内容</label>
                    <textarea id="content" placeholder="请输入留言内容" required></textarea>
                </div>
                <button type="submit">发布留言</button>
            </form>
        </section>
        
        <section class="messages-section">
            <h2>所有留言</h2>
            <div id="messagesList">
                <div class="empty-state" id="emptyState">
                    <i>💬</i>
                    <p>暂无留言，快来发布第一条留言吧！</p>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
