<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惊喜礼物</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <div id="initial-screen" class="screen active">
            <div class="gift-icon">
                <i class="fas fa-gift"></i>
            </div>
            <h1 class="main-text">点击查看礼物</h1>
            <p class="sub-text">有一个特别的惊喜在等待着你</p>
            <button id="view-btn" class="view-btn">
                <span>查看</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            <div class="hint">点击上方按钮查看礼物</div>
        </div>
        
        <div id="result-screen" class="screen">
            <div class="clock-icon">
                <i class="fas fa-clock"></i>
            </div>
            <h1 class="main-text">恭喜你，谢晨！！！已被浪费宝贵的1分钟</h1>
            <p class="sub-text">时间就是金钱，我的朋友！</p>
            <div class="timer-container">
                <div class="timer-circle">
                    <div class="timer-fill"></div>
                    <div class="timer-text">60</div>
                </div>
                <p class="timer-label">你的1分钟正在流逝...</p>
            </div>
            <button id="reset-btn" class="reset-btn">
                <span>再来一次</span>
                <i class="fas fa-redo"></i>
            </button>
            <div class="footer-note">
                <p><i class="fas fa-lightbulb"></i> 提示：时间宝贵，请合理使用</p>
            </div>
        </div>
        
        <div class="time-counter">
            <i class="far fa-clock"></i>
            <span>已浪费：<span id="wasted-time">0</span> 秒</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
